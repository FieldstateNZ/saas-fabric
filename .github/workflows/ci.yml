name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch/PR so pushing a fix doesn't queue
# behind a run that's already obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# ---------------------------------------------------------------------------
# The toolchain
# ---------------------------------------------------------------------------
#
# Every Rust job installs the version `rust-toolchain.toml` pins, rather than
# whatever `stable` means on the day. That file carries the reasoning; the
# short version is that this workspace denies every lint, so a new clippy
# release does not produce a warning somebody notices later -- it fails the
# build, on whichever pull request happens to be open, in code that pull
# request never touched.
#
# `rustup toolchain install` with no argument reads that file and installs it
# with its components. It replaced `dtolnay/rust-toolchain@stable`, which would
# have overridden the pin; rustup is preinstalled on the GitHub-hosted runner
# images, so dropping the action costs nothing and removes a third-party
# dependency from every Rust job.
#
# `rustup show active-toolchain` then records the version in the log, because
# when a gate fails for a reason nobody changed, the first question is which
# compiler ran.
#
# Upgrading is a deliberate change -- see docs/architecture/toolchain-policy.md.

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See "The toolchain" above: installs exactly what rust-toolchain.toml
      # pins, then records which version ran.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See "The toolchain" above: installs exactly what rust-toolchain.toml
      # pins, then records which version ran.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # Workspace lints (crates/**/Cargo.toml -> [lints] workspace = true,
      # rooted in the workspace Cargo.toml) already deny unwrap/expect/panic/
      # indexing and missing_docs, and warn on clippy::pedantic. `-D warnings`
      # is what turns those (and everything else clippy reports) into a CI
      # failure instead of noise nobody reads.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See "The toolchain" above: installs exactly what rust-toolchain.toml
      # pins, then records which version ran.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # `missing_docs` is denied at compile time, so clippy already catches an
      # undocumented item. What it does not catch is a documented one whose
      # links have rotted -- an intra-doc link to a renamed type, or to an
      # item that has since become crate-private. Only rustdoc sees those, and
      # only as warnings unless they are promoted here.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See "The toolchain" above: installs exactly what rust-toolchain.toml
      # pins, then records which version ran.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # fabric-ndc-acceptance is excluded so one job owns the claim "the
      # connector acceptance suite passed" -- the connector-acceptance job
      # below, which runs it with FABRIC_REQUIRE_CONNECTOR_ACCEPTANCE=1 so it
      # can never go green without a real connector actually answering.
      # Without the exclusion this job would also run those tests, but with
      # the requirement unset -- silently skipped on a runner with no Docker
      # daemon reachable the way this job expects, and silently run for real
      # on one that does, either way without the honesty the dedicated job
      # enforces.
      - run: cargo test --workspace --exclude fabric-ndc-acceptance

  connector-acceptance:
    name: cargo test -p fabric-ndc-acceptance (real ndc-postgres)
    runs-on: ubuntu-latest
    # The suite brings up postgres, a connector, and (for one test) an nginx
    # impostor, each gated by its own poll-to-deadline -- comfortably inside
    # a few minutes when everything answers normally. A cap here means a
    # daemon or network problem that would otherwise hang shows up as a
    # timeout with this job's name attached, not as "CI is stuck" with no
    # indication which job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # See "The toolchain" above: installs exactly what rust-toolchain.toml
      # pins, then records which version ran.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # GitHub-hosted `ubuntu-latest` ships Docker preinstalled and can pull
      # normally, so this needs no `services:` block -- the suite drives
      # `docker` itself (crates/fabric-ndc-acceptance/tests/support/docker/),
      # which is also what lets it start a second connector configuration and
      # the nginx impostor alongside the first.
      #
      # Pulled explicitly, here, rather than left to the test run's own
      # pull-on-first-use: a pull that happens inside the test binary
      # competes with that test's own timeout, and a slow registry would be
      # indistinguishable in the log from the connector itself being slow to
      # answer. Pulling the three pinned references as their own step puts
      # the pull time, and any pull failure, in a log section that says what
      # it is. `tests/support/docker/image_reference.rs` still pulls again
      # if a reference is somehow still absent when a test runs (it is not,
      # after this step succeeds), so this step is an optimisation and a
      # clearer log, not a change to what the suite itself guarantees.
      - name: Pull the pinned connector-acceptance images
        # The repository@digest form, with no tag -- the exact reduction
        # `tests/support/docker/image_reference.rs::repository_digest_form`
        # produces for every pinned reference before inspecting, pulling, or
        # returning it, and the exact string its own test
        # `ci_pre_pulls_exactly_the_pinned_images` asserts this step's
        # `docker pull` lines against, verbatim. The tag half was never
        # load-bearing to `docker pull` -- Docker resolves a
        # `name:tag@digest` reference by its digest alone -- so pulling the
        # reduced form here is what lets that test hold this step to the
        # pins byte-for-byte.
        run: |
          docker pull ghcr.io/hasura/ndc-postgres@sha256:f91910ef5107aa80d31d82639e149b7f41f4a5bb3af9a369397d7d5965d79a57
          docker pull postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
          docker pull nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
      # Required mode turns "no Docker" and "the pinned image isn't the one
      # that ran" from a silent skip into a failure naming what was missing
      # (tests/support/gate.rs, tests/support/docker/image_reference.rs).
      - run: cargo test -p fabric-ndc-acceptance
        env:
          FABRIC_REQUIRE_CONNECTOR_ACCEPTANCE: "1"

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-deny's own RustSec advisory-db clone, at its default path
      # ($CARGO_HOME/advisory-dbs, named explicitly in deny.toml). Caching it
      # avoids a full git clone of the advisory database on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-dbs
          key: advisory-db-${{ github.run_id }}
          restore-keys: advisory-db-
      # Enforces docs/architecture/dependency-policy.md via deny.toml at the
      # repository root: approved licences only, no unlicensed crates, no
      # banned advisories, no unexpected registries or git sources. Uses the
      # prebuilt cargo-deny binary rather than `cargo install` so this job
      # doesn't spend several minutes compiling the checker itself on every
      # run.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  file-size:
    name: file-size policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Enforces docs/architecture/file-size-policy.md: fails if any
      # production .rs file under crates/ exceeds 150 lines and isn't in the
      # script's documented exemption list.
      - run: python3 scripts/check_file_sizes.py

      # Enforces docs/architecture/toolchain-policy.md's "one version, one
      # place" rule where it is easiest to break it: a Dockerfile has to name a
      # builder image, and nothing else connects that to the pin. Without this,
      # CI could check the workspace with one compiler and ship an artifact
      # built by another.
      #
      # In this job rather than its own: both are a Python script over the
      # working tree, and a second runner for six lines of regex is not worth
      # the queue time.
      - run: python3 scripts/check_toolchain_pin.py

  architecture:
    name: architectural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See "The toolchain" above: installs exactly what rust-toolchain.toml
      # pins, then records which version ran.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The invariants no unit test can catch, because the violation is the
      # code compiling: NDC vocabulary escaping its crate, Keycloak
      # representations or Git-hosting details escaping theirs, an edge between
      # the runtime and control planes, transport reaching a domain crate, a
      # database driver or Git/Kubernetes client entering the graph at all,
      # X-Tenant-Id being read anywhere, the dependency direction diverging from
      # docs/architecture/crate-dependencies.md, or the operator console naming
      # another platform service's API. Needs a toolchain because it reads
      # `cargo metadata` rather than parsing manifests by hand.
      - run: python3 scripts/check_architecture.py

  # ---------------------------------------------------------------------------
  # The operator console
  # ---------------------------------------------------------------------------
  #
  # One job rather than four, deliberately: `npm ci` dominates the runtime of
  # each, and splitting them would pay for the install four times to parallelise
  # a few seconds of checking. The step names still say which check failed.
  console:
    name: control-plane-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/control-plane-ui/package-lock.json
      # `ci`, not `install`: it installs exactly what the lockfile pins and
      # fails if `package.json` and the lockfile disagree, which is the same
      # guarantee `Cargo.lock` gives the Rust half.
      - run: npm ci

      # The frontend half of the quality policy: no `any`, no floating
      # promises, no unused code, and the 150-line file limit from
      # docs/architecture/file-size-policy.md.
      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm test

      # Last, because a type error or a lint failure is a clearer message than
      # whatever the bundler would say about the same mistake.
      - name: vite build
        run: npm run build
