name: Hosting package
on:
  pull_request:
    paths: ['hosting/**', 'infrastructure/**', 'examples/**', 'apps/app-shell/**', '.github/workflows/hosting.yml']
  push:
    branches: [main]
    tags: ['hosting-v*']
    paths: ['hosting/**', 'infrastructure/**', 'examples/**', 'apps/app-shell/**', '.github/workflows/hosting.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/app-shell/package-lock.json
      - run: dotnet restore hosting/tests/SaaSFabric.Aspire.Hosting.Tests --locked-mode
      - run: dotnet test hosting/tests/SaaSFabric.Aspire.Hosting.Tests --no-restore -c Release
      # AppHost runtime packages depend on the runner OS; its macOS lock cannot
      # be reused on Linux. Library and test dependencies remain locked above.
      - run: dotnet build hosting/samples/SaaSFabric.Demo.AppHost -c Release
      - run: python3 -m unittest discover -s infrastructure/opentofu/tests -v
      - run: npm ci && npm test && npm run build
        working-directory: apps/app-shell
      - name: Resolve package version
        env:
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          version=0.0.0-local
          if [[ "$RELEASE_REF" == refs/tags/hosting-v* ]]; then
            version="${RELEASE_REF#refs/tags/hosting-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - run: dotnet pack hosting/src/SaaSFabric.Aspire.Hosting -c Release --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: hosting-package
          path: artifacts/*.nupkg
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/hosting-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a commit merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'
      - uses: actions/download-artifact@v4
        with:
          name: hosting-package
          path: artifacts
      - name: Publish to GitHub Packages
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: dotnet nuget push 'artifacts/*.nupkg' --source "https://nuget.pkg.github.com/$PACKAGE_OWNER/index.json" --api-key "$PACKAGE_TOKEN"
