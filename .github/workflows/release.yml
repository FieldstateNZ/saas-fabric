name: Release

# A release is a tag, and a tag is the only thing that publishes.
#
# Two kinds of tag, and the difference is what the version says rather than
# what this workflow does with it:
#
#   v0.3.0                  a stable release
#   v0.3.0-preview.42       a preview — an integration candidate, published so
#                           that current work is visible in an environment
#
# Both are built and published identically, from the same gates. Nothing here
# deploys either: what consumes a preview is the platform's desired state, and
# it discovers one by looking at the registry.
#
# `workflow_dispatch` builds the same three images and pushes nothing, so the
# packaging can be exercised without minting a version — even when it is
# started from a tag: only a *push* of a tag publishes (the version job's
# `publish` output, which every publishing step and job reads). There is deliberately
# no path that publishes from a branch: an image nobody can point at a tag is
# an image nobody can reason about.
on:
  push:
    tags:
      - 'v*'
  # Packaging that only runs at release time is packaging that breaks at
  # release time. A pull request touching any of these builds all three images
  # — on the architecture the cluster runs, which a developer's machine is not
  # — and pushes nothing.
  #
  # Scoped by path so an unrelated change does not pay ten minutes for it.
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'apps/control-plane-ui/Dockerfile'
      - 'apps/control-plane-ui/nginx.conf'
      - 'apps/control-plane-ui/package*.json'
      - '.github/workflows/release.yml'
      - 'rust-toolchain.toml'
      # The rollback floor and the contracts a release is held to, and the
      # declarations they are compared with: a change to any of them is a
      # change to what a release may publish.
      - 'compatibility.yaml'
      - 'scripts/release_compatibility.py'
      - 'scripts/tests/test_release_compatibility.py'
      - 'crates/fabric-component/src/compatibility.rs'
      - 'crates/fabric-runtime-publication/src/manifest.rs'
      - 'crates/fabric-runtime-publication/src/record.rs'
  workflow_dispatch:
    inputs:
      # Checks a version as if it were being tagged — its grammar and the
      # rollback floor — without publishing anything, so a tag the floor would
      # refuse is found before anybody pushes it.
      rehearse:
        description: 'A version to check against the rollback floor (publishes nothing)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

# The floor for every job, so a new one starts with the least privilege rather
# than the repository default.
#
# Without this, a job that declares no `permissions` inherits whatever the
# repository grants the workflow token — often far more than reading a
# checkout. `verify` needed nothing but the source and had no block of its own,
# which is exactly the shape that goes unnoticed: it works, so nobody looks.
#
# `build` keeps its own block and still states `packages: write`, because a job
# that publishes should say so where somebody reading it will see it.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The version, computed once
  # ---------------------------------------------------------------------------
  #
  # Every job that publishes something names the same version: the three image
  # legs, and the component descriptor attached after them (ADR 0026 section
  # 10). Computed in one place so the rule for what a tag may be is written
  # once.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      owner: ${{ steps.repo.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      # The version comes from the tag, and its *version core* must agree with
      # the workspace. A tag that disagreed would publish an image claiming a
      # version its source was never on.
      #
      # Not "an image whose name and `--version` disagree", which is what this
      # comment used to say: there is no `--version`. Nothing in the workspace
      # reads `CARGO_PKG_VERSION`, and no binary reports one. The artifact
      # version is an *image* fact — it is the tag, and it is
      # `org.opencontainers.image.version` below — which is where anything
      # reporting "what is running" reads it from.
      #
      # "Core" rather than "the whole tag" is what admits a preview.
      # `v0.3.0-preview.42` is a prerelease of 0.3.0, so the workspace has to
      # already be on 0.3.0 for it to be minted — you bump
      # `workspace.package.version` when you start working towards a release,
      # and every preview along the way is a prerelease of that number. The
      # eventual `v0.3.0` then matches exactly, with no second bump.
      #
      # So **you cannot cut a preview of a version the workspace is not on.**
      # That is the guarantee, not a limitation of it.
      #
      # The grammar is SemVer's own, minus build metadata: `+` is not a legal
      # character in an OCI tag, so a version carrying one could never name its
      # own image. A prerelease's numeric identifiers carry no leading zeros,
      # and the whole is at most 128 characters — the same rule the component
      # descriptor's version follows (fabric-component's `ComponentVersion`),
      # so no tag can publish images whose descriptor would then refuse them.
      #
      # The workspace version is checked first, on every event, because both
      # branches below derive an image tag from it: the published version's
      # core must equal it, and a dev build is tagged `<workspace>-dev`. It
      # must be a bare SemVer version core — three numeric identifiers with no
      # leading zeros, no prerelease, no build metadata — or a workspace that
      # drifted (`0.3`, `0.03.0`, `0.3.0-rc1`, an empty match) would reach
      # `docker build --tag` as a tag no release could ever satisfy.
      - name: Determine the version
        id: version
        run: |
          set -euo pipefail
          workspace=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'

          if ! printf '%s' "$workspace" | grep -Eq "^${core}\$"; then
            echo "::error::workspace.package.version '${workspace}' is not a SemVer version core (MAJOR.MINOR.PATCH, no leading zeros)"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'

            if [ "${#tagged}" -gt 128 ] || ! printf '%s' "$tagged" \
              | grep -Eq "^${core}(-${identifier}(\.${identifier})*)?\$"; then
              echo "::error::tag ${GITHUB_REF_NAME} is not a version this repository can publish"
              exit 1
            fi

            if [ "${tagged%%-*}" != "$workspace" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${workspace}"
              exit 1
            fi

            echo "version=$tagged" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${workspace}-dev" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # compatibility.yaml's minimumRollableVersion is the oldest release that
      # reads what this source writes (D01-21). A tag below it would publish
      # images Platform Management never rolls back to and that misread the
      # current formats, so it is refused before anything is built. A
      # rehearsal asks the same question of a version nobody has tagged.
      - name: Refuse a version below the rollback floor
        if: steps.version.outputs.publish == 'true' || inputs.rehearse != ''
        env:
          CANDIDATE: ${{ steps.version.outputs.publish == 'true' && steps.version.outputs.version || inputs.rehearse }}
        run: python3 scripts/release_compatibility.py floor "${CANDIDATE}"

      # Lower-cased because a registry namespace must be, and the organisation
      # is not.
      - name: Determine the repository
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Nothing is published from a commit that does not pass its own gates
  # ---------------------------------------------------------------------------
  #
  # These duplicate `ci.yml`, and the duplication is the point. CI runs on every
  # push, so a tagged commit has almost certainly been checked — but "almost
  # certainly" is doing the work in that sentence, and the failure it admits is
  # an artifact built from a red tree, which is then deployed and behaves in a
  # way no gate reproduces.
  #
  # A release is rare. Paying for the gates twice is the cheaper side of that
  # trade.
  verify:
    name: gates
    runs-on: ubuntu-latest
    # Only for a release. On a pull request `ci.yml` has already run every one
    # of these against the same commit, and running them twice in parallel
    # would double the queue to learn nothing.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # See "The toolchain" in ci.yml.
      - run: rustup toolchain install
      - run: rustup show active-toolchain

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - run: python3 scripts/check_file_sizes.py
      - run: python3 scripts/check_architecture.py

      # Named on its own although `cargo test --workspace` already ran it: the
      # compiled MINIMUM_ROLLABLE_VERSION, CONTRACT_VERSION and
      # MINIMUM_READER_CONTRACT must equal compatibility.yaml for this commit,
      # and that must stay a release gate however the line above is narrowed.
      - run: cargo test -p fabric-component --test this_repositorys_compatibility

      # The one gate that exists for this workflow: the builder image must be
      # the compiler the workspace is pinned to.
      - run: python3 scripts/check_toolchain_pin.py

      # And the component descriptor this release will attach last must render
      # from component.yaml before any image is pushed, so a release never
      # ends with images and no descriptor because the descriptor was refused.
      - run: cargo run -q -p fabric-component --example descriptor -- check component.yaml

  # ---------------------------------------------------------------------------
  # What the release is held to by compatibility.yaml
  # ---------------------------------------------------------------------------
  #
  # On every event, because it is the dry run of the release's compatibility
  # gates: a pull request runs exactly the checks a tag would, and fails on
  # the same disagreement.
  #
  # A release above the floor additionally proves the floor. The floor is a
  # promise that the release it names reads every format this source writes;
  # a version string cannot keep that promise (Riley, #139 and #140). Only the
  # floor's complete publication can: its provenance and own
  # compatibility.yaml, bound to one commit of this repository, to every
  # role's image — the publisher's above all, since publisherContract is the
  # control plane's — by tag, digest and label, and to its component
  # descriptor, which only a finished release has. If any of it is missing
  # or disagrees, the floor has to advance rather than be assumed.
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    needs: [version]
    permissions:
      contents: read
      # Read-only: the floor's provenance is read back, never written.
      packages: read
    env:
      # See the `descriptor` job.
      ORAS_IMAGE: ghcr.io/oras-project/oras@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ needs.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python3 -m unittest scripts/tests/test_release_compatibility.py -v

      # The declarations the binaries are compiled from must state what
      # compatibility.yaml states; `verify` also compiles and runs the Rust
      # test that holds the constants themselves to the file.
      - name: Check the contracts the source is built with
        run: python3 scripts/release_compatibility.py contracts

      # Whether this release is the floor, and so has no earlier floor to prove.
      - name: Find the floor
        id: floor
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          floor=$(python3 scripts/release_compatibility.py show minimumRollableVersion)
          echo "version=${floor}" >> "$GITHUB_OUTPUT"
          if [ "${VERSION}" = "${floor}" ]; then
            echo "prove=false" >> "$GITHUB_OUTPUT"
            echo "${VERSION} is the floor: verify checks its contracts and the descriptor job attaches its proof."
          else
            echo "prove=true" >> "$GITHUB_OUTPUT"
          fi

      # See "The toolchain" in ci.yml. Built before the registry login, as in
      # the `descriptor` job, so no dependency's build script runs while a
      # token is on disk: the roles component.yaml publishes, and Fabric's own
      # reader of whether a version is complete.
      - if: steps.floor.outputs.prove == 'true'
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo build -q -p fabric-component --example descriptor
          cargo build -q -p fabric-registry --example release_unit

      # The floor's complete published proof, assembled from the registry and
      # judged offline by release_compatibility.py:
      #
      #   images/<role>.json     what `<repository>:<floor>` resolves to, and
      #                          that image's source/revision/version labels,
      #                          for every role component.yaml publishes —
      #                          the publisher (controlPlane) included
      #   release/               the provenance and the floor's own
      #                          compatibility.yaml, attached to its runtime
      #                          image
      #   descriptor/            its component descriptor, attached last, so
      #                          an interrupted publication has none
      #
      # Then Fabric's reader must say the floor reads back as complete.
      - name: Require the floor's complete proof to carry these contracts
        if: steps.floor.outputs.prove == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          FLOOR: ${{ steps.floor.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          cargo run -q -p fabric-component --example descriptor -- images component.yaml > roles.txt

          printf '%s' "${TOKEN}" | docker login "${REGISTRY}" -u "${ACTOR}" --password-stdin
          oras() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${HOME}/.docker/config.json:/auth/config.json:ro" \
              -v "${PWD}:/work" -w /work --entrypoint /bin/oras "${ORAS_IMAGE}" \
              "$@" --registry-config /auth/config.json
          }
          advance="cut the floor with this workflow, or advance minimumRollableVersion"
          mkdir -p floor/images floor/release floor/descriptor

          while read -r role repository; do
            case "${repository}" in
              "${REGISTRY}/${OWNER}/"*) ;;
              *) echo "::error::component.yaml names ${repository}, which this workflow does not publish"; exit 1 ;;
            esac
            if ! digest=$(oras resolve "${repository}:${FLOOR}"); then
              echo "::error::the floor ${repository}:${FLOOR} could not be resolved; ${advance}"
              exit 1
            fi
            # A single image's config, or — if the push wrote an index — the
            # config of its one linux image, attestation manifests aside.
            manifest=$(oras manifest fetch "${repository}@${digest}")
            target="${digest}"
            if printf '%s' "${manifest}" | jq -e '.manifests' >/dev/null; then
              target=$(printf '%s' "${manifest}" | jq -er '
                [.manifests[] | select(.platform.os == "linux")
                  | select((.annotations // {})["vnd.docker.reference.type"] == null)]
                | if length == 1 then .[0].digest else error("not one linux image") end')
            fi
            oras manifest fetch-config "${repository}@${target}" \
              | jq --arg digest "${digest}" '{digest: $digest, labels: (.config.Labels // {})}' \
              > "floor/images/${role}.json"
          done < roles.txt

          repository=$(awk '$1 == "runtime" { print $2 }' roles.txt)
          subject=$(jq -r .digest floor/images/runtime.json)
          referrers=$(oras discover --format json "${repository}@${subject}")
          pull_one() {
            local filter="$1" into="$2" what="$3" found count
            found=$(printf '%s' "${referrers}" \
              | jq -r "[(.referrers // .manifests // [])[] | select(${filter}) | .digest] | unique | .[]")
            count=$(printf '%s' "${found}" | grep -c . || true)
            if [ "${count}" -ne 1 ]; then
              echo "::error::the floor ${repository}:${FLOOR} carries ${count} ${what}, not one; ${advance}"
              exit 1
            fi
            oras pull --output "${into}" "${repository}@${found}"
          }
          pull_one '.artifactType == "application/vnd.saas-fabric.release.v1"' floor/release "release proofs"
          pull_one '(.artifactType // "") | test("^application/vnd\\.saas-fabric\\.component\\.v[0-9]+$")' \
            floor/descriptor "component descriptors"

          python3 scripts/release_compatibility.py floor-artifact \
            --proof floor --source "${SOURCE}" --roles roles.txt

          if ! cargo run -q -p fabric-registry --example release_unit -- "${repository}" "${FLOOR}"; then
            echo "::error::the floor ${repository}:${FLOOR} does not read back as complete; ${advance}"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Three images from one context
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [verify, version, compatibility]
    # `!cancelled()` because `verify` is *skipped* when nothing will be
    # published, and a skipped dependency would otherwise skip this job too.
    # Not `always()`: cancelling a run re-evaluates every running job's
    # condition, and one that says `always()` would keep building and pushing
    # a release somebody just tried to stop.
    #
    # A job result is one of four values, and the condition has to name the one
    # it wants rather than exclude the one it fears. `!= 'failure'` reads as
    # "only when the gates passed" and is not: a `cancelled` gate — a killed
    # run, a lost runner — is not a failure, and would have published.
    #
    #   publishes?  verify result   builds?  pushes?
    #   ------------------------------------------------
    #   yes         success         yes      yes
    #   yes         failure         no       no
    #   yes         cancelled       no       no
    #   yes         skipped         no       no
    #   no          skipped         yes      no
    #   (run cancelled)             stops    no
    #
    # So: a published run requires success outright, and only a run that
    # publishes nothing may proceed on a skip. Nothing is published from a
    # commit whose gates did not pass. `compatibility` runs on every event, so
    # it must succeed outright on every event.
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      needs.compatibility.result == 'success' &&
      ( needs.verify.result == 'success' ||
      (needs.version.outputs.publish != 'true' && needs.verify.result == 'skipped') )
    permissions:
      contents: read
      # One of two elevated permissions in this workflow, and it is the job's own token —
      # there is no long-lived registry credential to store, rotate, or leak.
      packages: write
    strategy:
      # Not `fail-fast`: if one image fails to build, knowing whether the other
      # two would have is worth the minutes.
      fail-fast: false
      matrix:
        # `role` is each image's role in this repository's component.yaml, and
        # `primary` marks the image its component descriptor is attached to
        # (ADR 0026 section 10). The `descriptor` job reads the digests the legs
        # record by role; the pull-request test
        # crates/fabric-component/tests/this_repositorys_component.rs checks
        # both keys against component.yaml.
        include:
          # The name the platform already expects for the runtime plane.
          - image: saas-fabric
            dockerfile: Dockerfile
            target: runtime-api
            role: runtime
            primary: true
          - image: saas-fabric-control-plane
            dockerfile: Dockerfile
            target: control-plane-api
            role: controlPlane
            primary: false
          - image: saas-fabric-control-plane-ui
            dockerfile: apps/control-plane-ui/Dockerfile
            target: console
            role: console
            primary: false
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        if: needs.version.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "${TOKEN}" | docker login "${REGISTRY}" -u "${ACTOR}" --password-stdin

      # A published version never moves. Its component descriptor names these
      # images by digest, so a re-run that rebuilt one (builds are not
      # reproducible) would leave the version tag pointing at bytes the
      # descriptor does not name — incoherent for ever (ADR 0026 section 3).
      # Reusing a version is not supported; the fix is the next version.
      #
      # It fails closed: only the registry's own `404` for the tag means "not
      # published". A `200` refuses, and anything else — a `401`, a `429`, a
      # `5xx`, a network failure (`000`) — fails the leg rather than reading as
      # absence and pushing over a published version.
      - name: Refuse to move a published version
        if: needs.version.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ needs.version.outputs.owner }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -u "${ACTOR}:${TOKEN}" \
            "https://${REGISTRY}/token?service=${REGISTRY}&scope=repository:${OWNER}/${IMAGE}:pull" \
            | jq -er .token)
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGISTRY}/v2/${OWNER}/${IMAGE}/manifests/${VERSION}" || true)
          case "${status}" in
            404) ;;
            200) echo "::error::${OWNER}/${IMAGE}:${VERSION} is already published; cut a new version"; exit 1 ;;
            *)   echo "::error::could not tell whether ${OWNER}/${IMAGE}:${VERSION} is published (HTTP ${status})"; exit 1 ;;
          esac

      # Two tags, and **never `latest`**. The platform pins an explicit version
      # (specification section 25); a floating tag is how a cluster ends up
      # running something nobody chose. The commit tag is the one that answers
      # "what is actually in this image".
      #
      # Job outputs and matrix values reach every shell step through `env`,
      # never by interpolation into the script, so a value is a string the
      # shell quotes rather than text the shell parses.
      - name: Build
        env:
          OWNER: ${{ needs.version.outputs.owner }}
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          name="${REGISTRY}/${OWNER}/${IMAGE}"

          docker build \
            --file "${DOCKERFILE}" \
            --target "${TARGET}" \
            --tag "${name}:${VERSION}" \
            --tag "${name}:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            .

      # A smoke test that the entry point is the binary and that it starts far
      # enough to refuse a missing configuration. It catches the mistakes an
      # image build cannot: a binary copied to the wrong path, an entry point
      # naming something that is not there.
      - name: Check the image runs
        if: matrix.target != 'console'
        env:
          OWNER: ${{ needs.version.outputs.owner }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="${REGISTRY}/${OWNER}/${IMAGE}"
          output=$(docker run --rm "${name}:${VERSION}" /nonexistent.toml 2>&1 || true)

          echo "$output"
          echo "$output" | grep -q "could not start" \
            || { echo "::error::the image did not start and refuse a missing configuration"; exit 1; }

      # The version tag is pushed last. Everything that can fail after a push
      # — reading back the digest, keeping it for the descriptor — happens
      # before the version exists, so a leg that fails there can be re-run;
      # once the version is pushed, the leg refuses to run again (above).
      - name: Push the commit tag
        if: needs.version.outputs.publish == 'true'
        env:
          OWNER: ${{ needs.version.outputs.owner }}
          IMAGE: ${{ matrix.image }}
        run: docker push "${REGISTRY}/${OWNER}/${IMAGE}:sha-${GITHUB_SHA}"

      # The digest this leg pushed, by role, for the `descriptor` job to name.
      # Read back from what the push recorded rather than resolved later from
      # the tag, so the descriptor names the bytes this run built. Both tags
      # name the same image, so the digest is the version's too.
      - name: Record the pushed digest
        if: needs.version.outputs.publish == 'true'
        env:
          OWNER: ${{ needs.version.outputs.owner }}
          IMAGE: ${{ matrix.image }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          name="${REGISTRY}/${OWNER}/${IMAGE}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${name}:sha-${GITHUB_SHA}")
          digest="${digest#*@}"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not read the digest ${name} was pushed as"
            exit 1
          fi
          mkdir -p digests
          printf '%s' "$digest" > "digests/${ROLE}"

      # Kept as long as GitHub lets a run be re-run, because re-running the
      # `descriptor` job is the only way to finish a release whose attach step
      # failed: the legs that pushed refuse to run again.
      - name: Keep the pushed digest for the descriptor
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.role }}
          path: digests/${{ matrix.role }}
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: Push the version
        if: needs.version.outputs.publish == 'true'
        env:
          OWNER: ${{ needs.version.outputs.owner }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: docker push "${REGISTRY}/${OWNER}/${IMAGE}:${VERSION}"

  # ---------------------------------------------------------------------------
  # The component descriptor, attached last (ADR 0026 section 10)
  # ---------------------------------------------------------------------------
  #
  # A version is complete only when its component descriptor exists, so this
  # runs after every image leg succeeded and attaches to the runtime image —
  # the primary — the descriptor naming all three by the digests those legs
  # pushed. It runs only for a pushed tag whose commit is on `main`, and it
  # *fails* rather than skips otherwise: a tag cut from a branch publishes
  # images that an environment describing `saas-fabric` will report as
  # undescribed and never advance to, and that is worth a red run, not a quiet
  # one.
  #
  #   publishes?  verify    build     main?   attaches?
  #   ---------------------------------------------------
  #   yes         success   success   yes     yes
  #   yes         success   success   no      no (fails)
  #   yes         anything else               no
  #   no                                      no (never runs)
  #   (run cancelled)                         no
  #
  # A re-run is safe: the descriptor's bytes and its creation time are fixed by
  # the commit, so a second run renders the same document and finds it already
  # attached. A *different* descriptor already attached is refused, never
  # joined — two would make the version invalid for ever.
  descriptor:
    name: component descriptor
    runs-on: ubuntu-latest
    needs: [verify, version, compatibility, build]
    if: >-
      !cancelled() && needs.version.outputs.publish == 'true' &&
      needs.version.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.compatibility.result == 'success' &&
      needs.build.result == 'success'
    permissions:
      contents: read
      # The other elevated permission: attaching an artifact is a push.
      packages: write
    env:
      # ORAS 1.3.4, the version this repository already uses, pinned by digest
      # because it runs holding a token that can push.
      ORAS_IMAGE: ghcr.io/oras-project/oras@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ needs.version.outputs.owner }}
    steps:
      # No credential is left in the checkout: this job compiles third-party
      # crates below, and nothing they run should find a token that can push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The full-depth checkout above already fetched every branch, `main`
      # included, so nothing is fetched again here: with no credential left in
      # the checkout a second fetch would be anonymous, which works only while
      # the repository is public. The ref is required to exist rather than
      # assumed — a missing `origin/main` must fail as its own error, not read
      # as "not an ancestor".
      - name: Require a commit on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::the checkout has no refs/remotes/origin/main to test ${GITHUB_REF_NAME} against"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main, so its images get no component descriptor"
            exit 1
          fi

      # See "The toolchain" in ci.yml. The renderer and the reader below are
      # this repository's own, so the release attaches exactly what Fabric
      # will later read.
      - run: rustup toolchain install
      - run: rustup show active-toolchain

      # Built before the registry login, so no build script or procedural
      # macro of any dependency runs while a token that can push is on disk.
      # The `cargo run`s below then only run what is already built.
      - name: Build the renderer and the reader
        run: |
          cargo build -q -p fabric-component --example descriptor
          cargo build -q -p fabric-registry --example release_unit

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "${TOKEN}" | docker login "${REGISTRY}" -u "${ACTOR}" --password-stdin

      # Each role's repository comes from component.yaml, and each role's
      # digest from the leg that pushed it. The version tag must still point at
      # that digest: if anything moved it since, the descriptor would name bytes
      # the tag no longer does.
      - name: Check every image is still what its leg pushed
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          oras() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${HOME}/.docker/config.json:/auth/config.json:ro" \
              -v "${PWD}:/work" -w /work --entrypoint /bin/oras "${ORAS_IMAGE}" \
              "$@" --registry-config /auth/config.json
          }
          cargo run -q -p fabric-component --example descriptor -- images component.yaml > roles.txt
          digest_args=()
          while read -r role repository; do
            case "${repository}" in
              "${REGISTRY}/${OWNER}/"*) ;;
              *) echo "::error::component.yaml names ${repository}, which this workflow does not publish"; exit 1 ;;
            esac
            recorded=$(cat "digests/${role}")
            current=$(oras resolve "${repository}:${VERSION}")
            if [ "${current}" != "${recorded}" ]; then
              echo "::error::${repository}:${VERSION} is ${current}, but its build pushed ${recorded}"
              exit 1
            fi
            digest_args+=(--digest "${role}=${recorded}")
          done < roles.txt
          cargo run -q -p fabric-component --example descriptor -- \
            render component.yaml --version "${VERSION}" "${digest_args[@]}" --out component.json
          # The provenance names the same images by the same digests, and the
          # commit they were built from.
          image_args=()
          while read -r role repository; do
            image_args+=(--image "${role}=${repository}@$(cat "digests/${role}")")
          done < roles.txt
          python3 scripts/release_compatibility.py provenance \
            --version "${VERSION}" --commit "${GITHUB_SHA}" \
            --source "${SOURCE}" \
            "${image_args[@]}" --out release-provenance.json
          # The primary is the runtime role: the matrix marks it, and the
          # pull-request test pins that mark to component.yaml's roles. Its
          # repository is read from component.yaml, not written here twice.
          primary_repository=$(awk '$1 == "runtime" { print $2 }' roles.txt)
          echo "PRIMARY_REPOSITORY=${primary_repository}" >> "$GITHUB_ENV"
          echo "PRIMARY_DIGEST=$(cat digests/runtime)" >> "$GITHUB_ENV"

      # compatibility.yaml and the provenance, attached to the runtime image
      # before its component descriptor: a version that reads back as complete
      # always carries both. The descriptor stays last, so a publication
      # interrupted between the two has proof but no descriptor, and a later
      # release's `compatibility` job refuses it as a floor. A family of its
      # own, which Fabric's descriptor reader does not count as a descriptor.
      #
      # Idempotent as the descriptor is: the same two documents attached is
      # nothing to do, anything else is refused.
      - name: Attach the compatibility manifest and provenance
        run: |
          set -euo pipefail
          oras() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${HOME}/.docker/config.json:/auth/config.json:ro" \
              -v "${PWD}:/work" -w /work --entrypoint /bin/oras "${ORAS_IMAGE}" \
              "$@" --registry-config /auth/config.json
          }
          primary="${PRIMARY_REPOSITORY}@${PRIMARY_DIGEST}"
          type='application/vnd.saas-fabric.release.v1'
          attached=$(oras discover --format json "${primary}" \
            | jq -r --arg type "${type}" \
              '[(.referrers // .manifests // [])[] | select(.artifactType == $type) | .digest] | unique | .[]')
          ours=$(printf '%s\n' \
            "sha256:$(sha256sum compatibility.yaml | cut -d' ' -f1)" \
            "sha256:$(sha256sum release-provenance.json | cut -d' ' -f1)" | sort)

          count=$(printf '%s' "${attached}" | grep -c . || true)
          if [ "${count}" -gt 1 ]; then
            echo "::error::${primary} already carries ${count} release provenance documents: ${attached}"
            exit 1
          fi
          if [ "${count}" -eq 1 ]; then
            theirs=$(oras manifest fetch "${PRIMARY_REPOSITORY}@${attached}" | jq -r '.layers[].digest' | sort)
            if [ "${theirs}" = "${ours}" ]; then
              echo "The compatibility manifest and provenance are already attached as ${attached}."
              exit 0
            fi
            echo "::error::${primary} already carries different release provenance, ${attached}"
            exit 1
          fi

          oras attach \
            --artifact-type "${type}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            "${primary}" \
            "compatibility.yaml:application/vnd.saas-fabric.compatibility.v1+yaml" \
            "release-provenance.json:application/vnd.saas-fabric.release-provenance.v1+json"

      # Also kept with the run, so the provenance can be read without registry
      # access.
      - name: Keep the compatibility manifest and provenance with the run
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.version.outputs.version }}
          path: |
            compatibility.yaml
            release-provenance.json
          retention-days: 90
          if-no-files-found: error

      # None attached: attach. One attached with the same document: nothing to
      # do. Anything else: refuse, without pushing.
      - name: Attach the component descriptor
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          oras() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${HOME}/.docker/config.json:/auth/config.json:ro" \
              -v "${PWD}:/work" -w /work --entrypoint /bin/oras "${ORAS_IMAGE}" \
              "$@" --registry-config /auth/config.json
          }
          primary="${PRIMARY_REPOSITORY}@${PRIMARY_DIGEST}"
          family='application/vnd.saas-fabric.component.v'
          attached=$(oras discover --format json "${primary}" \
            | jq -r --arg family "${family}" \
              '[(.referrers // .manifests // [])[] | select((.artifactType // "") | startswith($family)) | .digest] | unique | .[]')
          ours="sha256:$(sha256sum component.json | cut -d' ' -f1)"

          count=$(printf '%s' "${attached}" | grep -c . || true)
          if [ "${count}" -gt 1 ]; then
            echo "::error::${primary} already carries ${count} component descriptors: ${attached}"
            exit 1
          fi
          if [ "${count}" -eq 1 ]; then
            manifest=$(oras manifest fetch "${PRIMARY_REPOSITORY}@${attached}")
            if [ "$(printf '%s' "${manifest}" | jq -r '.artifactType')" = "${family}1" ] \
              && [ "$(printf '%s' "${manifest}" | jq -r '.layers[0].digest')" = "${ours}" ]; then
              echo "The component descriptor is already attached as ${attached}."
              exit 0
            fi
            echo "::error::${primary} already carries a different component descriptor, ${attached}"
            exit 1
          fi

          created=$(date -u -d "$(git log -1 --format=%cI "${GITHUB_SHA}")" +%Y-%m-%dT%H:%M:%SZ)
          oras attach \
            --artifact-type "${family}1" \
            --annotation "org.opencontainers.image.created=${created}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.source=${SOURCE}" \
            "${primary}" \
            "component.json:${family}1+json"

      # The release is complete only if Fabric's own reader, reading
      # anonymously as LucentRoot does, says so. Asked up to three times, ten
      # seconds apart, because the tag-schema index a push has just rewritten
      # may take a moment to be served; an answer that stays anything but
      # complete, or an error, fails the release.
      - name: Read the version back as Fabric will
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            status=0
            cargo run -q -p fabric-registry --example release_unit -- \
              "${PRIMARY_REPOSITORY}" "${VERSION}" > evaluation.txt || status=$?
            cat evaluation.txt
            if [ "${status}" -eq 0 ]; then break; fi
            if [ "${status}" -ne 1 ] || [ "${attempt}" -eq 3 ]; then
              echo "::error::${PRIMARY_REPOSITORY}:${VERSION} did not read back as complete"
              exit 1
            fi
            sleep 10
          done
          {
            echo "### Component descriptor"
            echo
            echo '```'
            cat evaluation.txt
            echo '```'
            echo
            echo "### Release provenance"
            echo
            echo '```json'
            cat release-provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
