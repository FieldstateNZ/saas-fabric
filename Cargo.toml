[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/brettsmith/saas-fabric"

[workspace.dependencies]
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
figment = { version = "0.10", features = ["env", "toml"] }
http = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
    "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Internal crates
fabric-connector = { path = "crates/fabric-connector" }
fabric-connector-ndc = { path = "crates/fabric-connector-ndc" }
fabric-core = { path = "crates/fabric-core" }
fabric-data-api = { path = "crates/fabric-data-api" }
fabric-identity = { path = "crates/fabric-identity" }
fabric-tenant-runtime = { path = "crates/fabric-tenant-runtime" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
