[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/brettsmith/saas-fabric"

[workspace.dependencies]
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
# Already in the resolved graph via the TLS stack; naming it directly adds no
# crate to the supply chain and keeps the one security-sensitive use of
# randomness in this workspace from being hand-rolled.
getrandom = "0.4"
figment = { version = "0.10", features = ["env", "toml"] }
http = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The maintained fork of `serde_yaml`, whose author archived it. Verified at
# 0.9.42: MIT OR Apache-2.0, so Apache-2.0 is taken (dependency policy rule 2).
# Confined to the control plane -- desired state is YAML because a GitOps
# repository is edited by humans; nothing in the runtime plane reads it.
serde_norway = "0.9"
thiserror = "2"
# Parses the expiry a Git host states for a minted token. Already in the
# resolved graph via `jsonwebtoken` -> `simple_asn1`, so the direct edge adds
# no package and no licence surface; what it avoids is hand-rolled calendar
# arithmetic, which is not the sort of thing to write twice.
time = { version = "0.3", default-features = false, features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Internal crates -- shared kernel
fabric-core = { path = "crates/fabric-core" }
fabric-fga-auth = { path = "crates/fabric-fga-auth" }

# Internal crates -- runtime plane
fabric-connector = { path = "crates/fabric-connector" }
fabric-connector-ndc = { path = "crates/fabric-connector-ndc" }
fabric-data-api = { path = "crates/fabric-data-api" }
fabric-identity = { path = "crates/fabric-identity" }
fabric-tenant-runtime = { path = "crates/fabric-tenant-runtime" }

# Internal crates -- control plane. Deliberately a separate block: no crate in
# the runtime block may depend on anything in this one, and
# scripts/check_architecture.py fails the build if one ever does.
fabric-client-git = { path = "crates/fabric-client-git" }
fabric-client-model = { path = "crates/fabric-client-model" }
fabric-control-plane = { path = "crates/fabric-control-plane" }
fabric-keycloak = { path = "crates/fabric-keycloak" }
fabric-openbao = { path = "crates/fabric-openbao" }
fabric-reconciliation = { path = "crates/fabric-reconciliation" }

[workspace.lints.rust]
# Deny, not warn. Every public item in this workspace is documented today, so
# this costs nothing to turn on and is the only setting that keeps it true —
# a warning in a build that already prints warnings is a warning nobody reads.
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
