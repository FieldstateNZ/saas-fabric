# Serving the operator console's built files, and nothing else.
#
# This server does not proxy `/api`. The console calls the control-plane API on
# the same origin, so the **operator ingress** must route `/api` to the API
# service and everything else here — that routing is the platform's to own
# (specification section 8), and putting it in this image would mean the UI
# container knowing the API's address.
#
# # Why the headers are repeated in each location
#
# nginx's `add_header` is inherited from an outer block *only if the inner
# block declares no `add_header` of its own*. A `server`-level security header
# beside a `location`-level `Cache-Control` therefore silently disappears from
# every response that location serves — including the document itself, which is
# where the headers matter most.
#
# This is not a hypothetical: the first version of this file had exactly that
# shape, and running the image showed `X-Frame-Options` missing from `GET /`.
# Repeating three lines is the price of not relying on that rule.

map $sent_http_content_type $console_cache_control {
    # The entry point points at the current bundle. A cached copy pins an
    # operator to a version that no longer exists.
    default                 "no-store";

    # Bundle names carry a content hash, so a stale copy is a different URL.
    ~*^(text/css|application/javascript) "public, max-age=31536000, immutable";
}

server {
    # 8080 rather than 80: the unprivileged image cannot bind a low port, which
    # is the reason it is the unprivileged image.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The console loads its own bundle and its own stylesheet, and talks to its
    # own origin: no inline script, no inline style, no framing, and nothing
    # fetched from anywhere else.
    #
    # `form-action` carries the one exception, and it is a real one. Creating
    # the GitHub App is a **cross-origin form POST** — the App Manifest flow
    # takes the manifest as POST data and navigates the operator to GitHub's
    # approval screen, which is why the console builds a real form instead of
    # calling `fetch`. Without github.com here the browser blocks the
    # submission and in-product installation stops at its first step:
    #
    #     Sending form data to 'https://github.com/organizations/.../apps/new'
    #     violates the following Content Security Policy directive:
    #     "form-action 'self'"
    #
    # It stays narrow on both axes: one origin, and only for form submissions.
    # Nothing else is widened — script, style, image and connect sources all
    # still fall through `default-src 'self'`, so the console still cannot load
    # or call anything off its own origin. The two other outbound steps are
    # top-level navigations rather than posts and need nothing here.
    #
    # A GitHub Enterprise deployment posts to its own host instead
    # (`git_host.web_base_url`) and must add that origin. This image bakes the
    # policy in, so that is a rebuild rather than a setting — the honest cost
    # of not running a security header through envsubst at container start,
    # where a substitution mistake fails open and silently.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $console_cache_control always;

    # The console has no router, so there is no history fallback here on
    # purpose. A path this server does not have is a mistake, and answering it
    # with the application shell would hide that behind a blank screen.
    location / {
        try_files $uri $uri/ =404;
    }

    # Neither the liveness of this container nor the health of the control
    # plane, and it does not pretend to be: it answers whether nginx is
    # serving, which is the only question a static file server can answer about
    # itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
