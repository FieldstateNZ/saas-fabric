# What SaaS Fabric is, as a component (ADR 0026).
#
# The authored form of this repository's component descriptor: the same
# document a release publishes, without a version and without digests. On a
# pushed tag whose commit is on main, the release renders it with
# fabric-component's renderer from the digests its image legs pushed, and
# attaches the result to the runtime image last (ADR 0026 section 10;
# docs/architecture/packaging.md).
#
# It declares no capabilities, fields or resources, and never will: SaaS
# Fabric is the platform that provides them, not a component that needs them.
#
# Its roles and repositories are the contract with saas-fabric-platform, whose
# components.yaml pins these three images by these three roles. Changing a
# role or a repository is changing that contract. A test on every pull
# request (crates/fabric-component/tests/this_repositorys_component.rs)
# renders this file and checks it against the release workflow's build
# matrix, so the two cannot drift apart.
apiVersion: fabric.fieldstate.nz/v1
kind: Component
spec:
  name: saas-fabric
  title: SaaS Fabric
  description: A multi-tenant SaaS platform's runtime, control plane and operator console.
  images:
    runtime:
      repository: ghcr.io/fieldstatenz/saas-fabric
    controlPlane:
      repository: ghcr.io/fieldstatenz/saas-fabric-control-plane
    console:
      repository: ghcr.io/fieldstatenz/saas-fabric-control-plane-ui
  capabilities: []
  fields: []
  resources: []
