[package]
name = "fabric-api"
description = "The SaaS Fabric runtime plane host: the composition root."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fabric_api"
path = "src/lib.rs"

[[bin]]
name = "fabric-api"
path = "src/main.rs"

[dependencies]
fabric-connector.workspace = true
fabric-connector-ndc.workspace = true
fabric-core.workspace = true
fabric-data-api.workspace = true
fabric-identity.workspace = true
fabric-tenant-runtime.workspace = true

async-trait.workspace = true
axum.workspace = true
figment.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { workspace = true, features = ["timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
