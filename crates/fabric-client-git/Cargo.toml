[package]
name = "fabric-client-git"
description = "The Git-backed desired-state repository. Every Git-hosting detail in this platform lives inside this crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fabric-client-model.workspace = true
fabric-control-plane.workspace = true
fabric-core.workspace = true

async-trait.workspace = true
base64.workspace = true
# Signs the App assertion the installation-token endpoint authenticates. The
# same crate the runtime plane verifies bearer tokens with; this is the only
# place in the control plane that touches JWTs.
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
# `sync` only: the installation-token cache is the one piece of shared mutable
# state in this crate, and it is held across an await.
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
