[package]
name = "fabric-connector-ndc"
description = "Speaks the Hasura NDC protocol (read from v0.2.13, requires v0.2.4+) as an internal connector boundary. Contains no Hasura code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fabric-connector.workspace = true
fabric-core.workspace = true

async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `net` and `io-util` stand up the fake NDC connector in `client::fake_connector`,
# which is a real socket rather than a mocked transport: the failures this crate
# has to tell apart -- a refused connect, a request that went out and was never
# answered, a body truncated after `200 OK` -- only differ at that level.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
