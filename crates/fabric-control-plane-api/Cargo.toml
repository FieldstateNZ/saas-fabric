[package]
name = "fabric-control-plane-api"
description = "The SaaS Fabric control plane host: the composition root for the operator-facing API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fabric_control_plane_api"
path = "src/lib.rs"

[[bin]]
name = "fabric-control-plane-api"
path = "src/main.rs"

[dependencies]
fabric-client-git.workspace = true
fabric-client-model.workspace = true
fabric-control-plane.workspace = true
# Platform Management: the rules, the two adapters it is composed over,
# and the App credential type they share.
fabric-git-host.workspace = true
fabric-platform-git.workspace = true
fabric-platform-management.workspace = true
fabric-registry.workspace = true
fabric-core.workspace = true
fabric-keycloak.workspace = true
fabric-openbao.workspace = true
fabric-reconciliation.workspace = true

axum.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal"] }
tower-http = { workspace = true, features = ["timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
