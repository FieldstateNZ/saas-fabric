[package]
name = "fabric-git-host"
description = "Authenticating to a Git host as a GitHub App. The one place installation tokens are minted, cached and expired."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fabric-core.workspace = true

# Signs the App assertion the installation-token endpoint authenticates. The
# same crate the runtime plane verifies bearer tokens with; this is the only
# place in the control plane that touches JWTs.
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
# `sync` only: the installation-token cache is the one piece of shared mutable
# state in this crate, and it is held across an await.
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
