[package]
name = "fabric-platform-management"
description = "Which component version an environment should run: channels, release units, and the rules that decide."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fabric-core.workspace = true

async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
time.workspace = true
# Only the lock. The platform binding holds a read guard across the await of
# whatever it delegates to, so that an unbind waits for the operations already
# running against the repository it is replacing -- and a guard that blocks the
# thread cannot be held across an await point.
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
