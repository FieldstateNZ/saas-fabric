[package]
name = "fabric-registry"
description = "Reading published artifacts from OCI registries, by each registry kind's rules: read-only, a credential only where it was registered, and nowhere near the platform's Git credential."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The component descriptor's contract names and bounds: its artifact type
# family, and the most bytes a document may have. Only constants and the
# family's version parsing -- this adapter never parses a document.
fabric-component.workspace = true
fabric-platform-management.workspace = true

# Registries are swapped whole when one is registered, replaced or removed,
# so a pass in flight reads through the map it started with and never waits
# on a lock to do it.
arc-swap.workspace = true
async-trait.workspace = true
reqwest.workspace = true
# `ring::digest` only: every manifest and blob read is hashed.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
# `tokio::net::lookup_host` only: a registry an operator registered resolves
# its names through a resolver that hands back public addresses alone.
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
