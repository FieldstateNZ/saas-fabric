[package]
name = "fabric-tenant-runtime"
description = "The runtime tenant registry: what each tenant currently has, and how that changes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fabric-connector.workspace = true
fabric-core.workspace = true

arc-swap.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time", "rt"] }
tracing.workspace = true

[dev-dependencies]
# `test-util` supplies tokio's paused clock. The refresh loop's guarantees are
# timing-dependent, and a test that waits on a real interval only makes the loop
# *likely* to have run — a slow machine would let a broken build pass.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
