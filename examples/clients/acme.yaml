# An example client's desired state.
#
# This is the document format the control plane reads and writes, and the shape
# a `saas-fabric-clients` repository holds at
# `clients/<client id>/client.yaml`. See
# docs/architecture/client-desired-state.md for the contract.
apiVersion: fabric.fieldstate.nz/v2
kind: Client

metadata:
  name: acme

spec:
  displayName: Acme

  hosts:
    - www.example.com

  identity:
    # Conventionally the client id, but stated rather than derived:
    # reconciliation has to name it.
    realm: acme

    # Both required roles are present. Removing either is refused — the
    # platform's contract with a client assumes a realm distinguishes an
    # administrator of the client from an ordinary user of it.
    roles:
      - Client Realm Administrator
      - Client Realm User

    clients:
      - id: web
        type: oidc
        # Required, and stated rather than defaulted: a public client with no
        # proof key is one whose authorisation code is redeemable by whoever
        # intercepts it.
        pkce: s256
        # The strategy says which kind of callback this client is entitled to,
        # and a URI outside that kind is refused rather than accepted because
        # it happens to parse. `claimedHttps` is the production rule, and also
        # what an iOS Universal Link and an Android App Link are.
        redirect:
          strategy: claimedHttps
          uris:
            - https://www.example.com/callback

  # Sections the control plane does not model yet. They are here precisely so
  # the examples demonstrate the guarantee that matters most: editing identity
  # through the API leaves every one of them untouched.
  features:
    invoicing: true
    analytics: false

  data:
    primary:
      class: dedicated
      provider: sql
      region: au-east
