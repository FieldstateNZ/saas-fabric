# Example SaaS Fabric control plane configuration.
#
# Load with:  fabric-control-plane-api examples/control-plane.toml
# Or:         FABRIC_CP_CONFIG=examples/control-plane.toml fabric-control-plane-api
#
# Environment variables override the file. Settings are namespaced
# FABRIC_CP_SETTING_, with `__` for nesting:
#     FABRIC_CP_SETTING_CONTROL_PLANE__RECONCILIATION__INTERVAL_SECONDS=10
#
# That namespace is narrower than the runtime plane's FABRIC_SETTING_ on
# purpose: both processes run in one Kubernetes namespace, and a shared
# settings prefix would let one process's override land in the other's
# configuration — where `deny_unknown_fields` would abort startup for a reason
# nobody could see. FABRIC_CP_CONFIG above and the FABRIC_SECRET_* variables
# sit outside it by construction.
#
# This example runs the control plane with **development adapters**: desired
# state from a local directory, and an in-memory identity provider. It needs no
# cluster, no Keycloak, and no GitHub token. Both are refused as production
# postures by being named explicitly — see the comments on each.

listen = "0.0.0.0:8081"

# The overall budget for one operator request. Longer than the Git adapter's
# own per-call timeout so the adapter's failure is the one that surfaces.
request_timeout_seconds = 30


# ---------------------------------------------------------------------------
# Operator identity
# ---------------------------------------------------------------------------
#
# The control plane consumes an operator identity that the operator-plane proxy
# has already established (ADR 0009). It is authentication-agnostic in the same
# way the runtime plane is (ADR 0002) — and it carries the same obligation:
# this API must be reachable only from the operator network, because a header
# is trivially forgeable by anything that can reach the service directly.
#
# For local development, send the header yourself:
#     curl -H 'Tailscale-User-Login: operator@example.com' \
#          http://localhost:8081/api/clients
# The only posture. There is no development shortcut beside it, deliberately:
# the one that existed asserted a name from a proxy header, was safe only
# because of where the service sat, and could lend the platform nothing to act
# on Keycloak with.
#
# That means this example needs a Keycloak to sign in against. It still loads
# and starts without one — the desired-state and identity-provider adapters
# below are development ones — but signing in is not something this file can
# fake, and pretending otherwise is what the removed posture did.
[control_plane.operator]
mode = "oidc"

# What appears in a token, and where the browser is sent.
issuer = "http://localhost:8080/realms/master"

# Where *this process* reaches the same realm. Defaults to the issuer and is
# omitted here because one URL serves both locally. On a cluster it usually
# does not: the issuer is a public hostname resolved outside, and the pod has a
# service address resolved inside.
#
#     reachable_at = "http://keycloak-http.identity.svc.cluster.local/realms/master"
client_id = "saas-fabric-console"
required_role = "fabric-operator"

# The console's origin root, not a path beneath it: the console is served with
# no history fallback, so a redirect to /callback would answer 404.
redirect_uri = "http://localhost:5173/"


[control_plane.reconciliation]
# How often every client is swept. This bounds how long **drift** — a realm
# changed outside SaaS Fabric — goes unnoticed, which is what sets the value;
# a lost trigger is the lesser concern, because an accepted write asks for a
# pass immediately.
interval_seconds = 60


# ---------------------------------------------------------------------------
# Desired state
# ---------------------------------------------------------------------------
#
# Production uses `mode = "managed"`, which is the whole of it:
#
#     [desired_state]
#     mode = "managed"
#
# The control plane then starts knowing only that it has no client
# configuration repository, reports itself unconfigured, and stays available so
# that an operator can connect one through the console. Nothing about a Git
# host belongs in a deployment any more.
#
# Two more sections go with it, and both have workable defaults:
#
#     # Where this instance keeps what it must not lose. The default is an
#     # in-memory store, which is right for development and says so loudly at
#     # startup; a real deployment states OpenBao.
#     [secret_store]
#     mode = "open_bao"
#     address = "http://openbao.secrets.svc.cluster.local:8200"
#     role = "saas-fabric-control-plane"
#
#     # Only needed for an enterprise Git host or a different commit identity.
#     [git_host]
#     api_base_url = "https://api.github.com"
#     web_base_url = "https://github.com"
#
# And `control_plane.public_base_url` must be set: the Git host returns the
# operator's browser to it after each approval.
#
# `mode = "git"` remains for a deployment that genuinely wants to state where
# desired state lives, and is what the integration tests drive. A deployment
# that states it has opted out of the managed path, so stating it wrongly is
# still fatal at startup:
#
#     [desired_state]
#     mode = "git"
#     api_base_url = "https://api.github.com"
#     owner = "FieldstateNZ"
#     repository = "saas-fabric-clients"
#     branch = "main"
#     path_prefix = "clients"
#     document_file = "client.yaml"
#     token_ref = "git/saas-fabric-clients"
#
# `token_ref` names a secret; it never carries one. The platform delivers the
# value (§20) — this application only states that it needs one.
[desired_state]
mode = "local_directory"
path = "examples/clients"


# ---------------------------------------------------------------------------
# Identity provider
# ---------------------------------------------------------------------------
#
# Production uses `mode = "keycloak"`:
#
#     [identity_provider]
#     mode = "keycloak"
#     base_url = "http://keycloak-http.identity.svc.cluster.local"
#     admin_realm = "master"
#     client_id = "saas-fabric"
#     audience = "saas-fabric"
#
# **There is no credential here, and that is the design.** The platform holds
# no authority over Keycloak of its own: it acts as the operator who asked,
# using the bearer they presented, so permission to create a realm belongs to a
# person in the master realm rather than to a service account (ADR 0012).
#
# `audience` is the string every declared client's mapper asserts, and it must
# be the **same string** as the Data API's own required audience in this
# deployment (ADR 0019 §1 "The equality constraint", and §G5 — one API
# audience per deployment). That other setting is `[token].audiences` in
# `examples/config.toml`, the runtime plane's own configuration — a different
# process, loaded from a different file, required to agree on this one value.
# Nothing here can check that the two settings agree; a mismatch does not fail
# loudly, it makes the edge refuse every genuine token from every client this
# adapter writes. `audience` has no built-in default for exactly this reason
# — see `KeycloakConfig::audience`'s rustdoc in `fabric-keycloak`.
#
# Two things follow. The OIDC operator posture becomes required, because a
# trusted header asserts a name and lends nothing. And convergence happens when
# an operator acts — a write, or `POST /api/reconciliation` — rather than on a
# schedule, because there is no authority available when nobody is there.
[identity_provider]
mode = "in_memory"


# ---------------------------------------------------------------------------
# Platform Management
# ---------------------------------------------------------------------------
#
# Omitted here, and omitting it is a decision rather than an oversight: this
# deployment manages no platform repository, so the platform routes report
# themselves unconfigured instead of failing. A deployment that does manage one
# states which environment it *is* and nothing about which repository holds it —
# an operator installs the Platform Management GitHub App and picks that.
#
#     [platform_management]
#     environment = "lucentroot"
#
#     # How long one whole desired-state operation may take. The budget stops
#     # the adapter *starting* a call it cannot afford and never abandons a
#     # write already sent, so an operation runs for this plus one
#     # `git_host.http_timeout_seconds` — and startup refuses to run unless
#     # that **sum** is strictly less than `request_timeout_seconds` above.
#     #
#     # The platform binding holds a lock across an operation, so an operator's
#     # disconnect waits for whatever is already running. That wait is the
#     # longest drain, and it is what the sum bounds — below the request
#     # timeout, with headroom for the rest of the disconnect, rather than a
#     # promise the whole of it fits. A sum that did not fit would leave the
#     # operator a 504 they could not tell from a platform that never let go.
#     # The defaults are 15 + 10 against 30, leaving five seconds of headroom.
#     operation_timeout_seconds = 15
#
#     # How often the environment is swept. Zero disables it, and so does
#     # omitting this whole section.
#     reconciliation_interval_seconds = 60
