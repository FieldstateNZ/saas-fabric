server {
    listen 80;
    server_name _;
    root /brands/public;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin "*" always;
    location = /healthz { return 200 "ready\n"; }
    location / {
        autoindex off;
        try_files $uri =404;
    }
}
